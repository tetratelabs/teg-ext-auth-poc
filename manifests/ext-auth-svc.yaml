---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: custom-proxy-config
spec:
  logging:
    level:
      default: trace
  provider:
    type: Kubernetes
    kubernetes:
      envoyDeployment:
        container:
          volumeMounts:
          - mountPath: /var/run/envoy-uds
            name: dsdsocket
        initContainers:
        - name: ext-auth-svc
          restartPolicy: Always
          command:
          - /ext-auth
          image: ghcr.io/tetratelabs/teg-ext-auth-poc:latest
          imagePullPolicy: IfNotPresent
          volumeMounts:
          - mountPath: /var/run/envoy-uds
            name: dsdsocket
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
        - env:
          - name: DD_APM_ENABLED
            value: "true"
          - name: DD_APM_NON_LOCAL_TRAFFIC
            value: "true"
          - name: DD_TAGS
            value: env:test region:eu-central-2 service:my-service
          - name: DD_API_KEY
            value: my_datadog_api_key
          - name: DD_SITE
            value: datadoghq.com
          - name: DD_EKS_FARGATE
            value: "true"
          - name: DD_DOGSTATSD_SOCKET
            value: /var/run/envoy-uds/dsd.socket
          - name: DD_APM_RECEIVER_SOCKET
            value: /var/run/envoy-uds/apm.socket
          - name: DD_DOGSTATSD_ORIGIN_DETECTION
            value: "true"
          - name: DD_KUBERNETES_KUBELET_NODENAME
            valueFrom:
              fieldRef:
                apiVersion: v1
                fieldPath: spec.nodeName
          image: datadog/agent:7.64.3
          imagePullPolicy: IfNotPresent
          name: datadogagent-sidecar
          resources:
            limits:
              cpu: 400m
              memory: 512Mi
            requests:
              cpu: 100m
              memory: 128Mi
          restartPolicy: Always
          volumeMounts:
          - mountPath: /var/run/envoy-uds
            name: dsdsocket
        pod:
          volumes:
          - emptyDir: {}
            name: dsdsocket
  telemetry:
    accessLog:
      settings:
      - format:
          text: |
            {"start_time":"%START_TIME%","method":"%REQ(:METHOD)%","x-envoy-origin-path":"%REQ(X-ENVOY-ORIGINAL-PATH?:PATH)%","protocol":"%PROTOCOL%","response_code":"%RESPONSE_CODE%","response_flags":"%RESPONSE_FLAGS%","response_code_details":"%RESPONSE_CODE_DETAILS%","connection_termination_details":"%CONNECTION_TERMINATION_DETAILS%","upstream_transport_failure_reason":"%UPSTREAM_TRANSPORT_FAILURE_REASON%","bytes_received":"%BYTES_RECEIVED%","bytes_sent":"%BYTES_SENT%","duration":"%DURATION%","x-envoy-upstream-service-time":"%RESP(X-ENVOY-UPSTREAM-SERVICE-TIME)%","x-forwarded-for":"%REQ(X-FORWARDED-FOR)%","user-agent":"%REQ(USER-AGENT)%","x-request-id":"%REQ(X-REQUEST-ID)%",":authority":"%REQ(:AUTHORITY)%","upstream_host":"%UPSTREAM_HOST%","upstream_cluster":"%UPSTREAM_CLUSTER%","upstream_local_address":"%UPSTREAM_LOCAL_ADDRESS%","downstream_local_address":"%DOWNSTREAM_LOCAL_ADDRESS%","downstream_remote_address":"%DOWNSTREAM_REMOTE_ADDRESS%","requested_server_name":"%REQUESTED_SERVER_NAME%","route_name":"%ROUTE_NAME%","ccrt-subject":"%REQ(X-Forwarded-Client-Cert)%","token_2":"%REQ(AUTHORIZATION)%"}
          type: Text
        sinks:
        - file:
            path: /dev/stdout
          type: File
    tracing:
      customTags:
        provider:
          literal:
            value: datadog-teg-traces
          type: Literal
      provider:
        backendRefs:
        - group: gateway.envoyproxy.io
          kind: Backend
          name: datadog-svc
          namespace: envoy-gateway-system
          port: 8126
        port: 4317
        type: Datadog
      samplingRate: 10
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: Backend
metadata:
  name: ext-auth-svc
spec:
  endpoints:
  - unix:
      path: /var/run/envoy-uds/ext-auth.sock
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: Backend
metadata:
  name: datadog-svc
  namespace: envoy-gateway-system
spec:
  endpoints:
  - unix:
      path: /var/run/envoy-uds/apm.socket
  type: Endpoints
